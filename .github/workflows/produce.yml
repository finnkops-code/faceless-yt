name: produce
on:
  push:
    branches: [main]
    paths: ["content/queue/**", "trigger/**"]
  schedule:
    - cron: "17 6 * * *"     # daily safety net + stats snapshot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'release' }}
      MAX_PER_RUN: ${{ vars.MAX_PER_RUN || '1' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'kokoro' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'bm_fable' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q -r requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: |
            models
            assets/music_cache
          key: kokoro-v1.0-music-v1
      - name: Download Kokoro voice model (first run only)
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f models/$f ] || curl -sL -o models/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done

      - name: Render (and upload when UPLOAD_MODE=api)
        id: render
        run: |
          if ls content/queue/*.json >/dev/null 2>&1; then
            python -m pipeline.run_queue
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          else
            echo "queue empty"
          fi

      - name: Publish release assets (browser-upload mode)
        if: steps.render.outputs.rendered == 'true' && env.UPLOAD_MODE != 'api'
        run: |
          for d in output/*/; do
            slug=$(basename "$d")
            [ -f "$d/video.mp4" ] || continue
            extra=()
            for s in "$d"short_*/; do
              [ -f "$s/video.mp4" ] || continue
              n=$(basename "$s")
              cp "$s/video.mp4" "$d/$n.mp4"; cp "$s/metadata.json" "$d/$n.json"; cp "$s/captions.srt" "$d/$n.srt"
              extra+=("$d/$n.mp4" "$d/$n.json" "$d/$n.srt")
            done
            gh release create "video-$slug" "$d/video.mp4" "$d/thumbnail.jpg" \
              "$d/metadata.json" "$d/captions.srt" "${extra[@]}" \
              --title "$slug" --notes "Long video + captions + Shorts (short_N.*). Ready for upload" || true
          done

      - name: Stats snapshot
        if: env.YT_REFRESH_TOKEN != ''
        continue-on-error: true
        run: |
          mkdir -p data
          python -m pipeline.stats 2> >(tee data/stats_error.txt >&2) && rm -f data/stats_error.txt

      - name: Commit queue/state changes
        run: |
          git config user.name "faceless-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p data && cp output/run.json "data/last_run.json" 2>/dev/null || true
          for d in output/*/; do [ -f "$d/youtube.json" ] && cp "$d/youtube.json" "data/$(basename $d).youtube.json"; done 2>/dev/null || true
          git add content data
          git diff --cached --quiet || git commit -m "pipeline: processed queue [skip ci]"
          git push
